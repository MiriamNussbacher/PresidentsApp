<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Presidents App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Presidents of the United States</h1>

    <div class="container">
        <div class="form-section">
            <h2>Add / Update President</h2>
            <form id="president-form">
                <input type="hidden" id="president-id">
                <label for="name">Name:</label>
                <input type="text" id="name" required>

                <label for="birthdate">Birthdate:</label>
                <input type="date" id="birthdate" required>

                <label for="inaugurationDate">Inauguration Date:</label>
                <input type="date" id="inaugurationDate" required>

                <label for="termCount">Term Count:</label>
                <input type="number" id="termCount" min="1" required>

                <button type="submit">Submit</button>
                <button type="button" id="reset-btn">Reset</button>
            </form>
        </div>

        <div class="list-section">
            <h2>Presidents List</h2>
            <input type="date" id="filter-date" placeholder="Born after...">
            <button id="filter-btn">Filter</button>
            <button id="clear-filter-btn">Clear Filter</button>
            <table id="presidents-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Birthdate</th>
                        <th>Inauguration Date</th>
                        <th>Term Count</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Presidents data will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
